<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Profil - Ziyaretçi Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #c0c0c0;
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px; flex-wrap: wrap; gap: 12px;
    }
    header h1 {
      font-size: 1.6rem; font-weight: 900; color: #1DB954;
      letter-spacing: 1px;
    }
    header h1 span { color: #555; font-weight: 400; font-size: 0.9rem; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      background: #111; border-radius: 12px; padding: 20px;
      border: 1px solid #222; text-align: center;
    }
    .stat-card .value {
      font-size: 2rem; font-weight: 900; color: #1DB954;
    }
    .stat-card .label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;
      color: #555; margin-top: 4px; font-weight: 700;
    }
    .controls {
      display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
      align-items: center;
    }
    .controls input, .controls select {
      background: #111; border: 1px solid #333; color: #c0c0c0;
      padding: 10px 14px; border-radius: 8px; font-size: 0.9rem;
      font-family: inherit; outline: none;
    }
    .controls input:focus, .controls select:focus { border-color: #1DB954; }
    .controls input { flex: 1; min-width: 200px; }
    .controls .count { color: #555; font-size: 0.85rem; }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    th {
      background: #111; text-align: left; padding: 12px 10px;
      color: #1DB954; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; font-size: 0.7rem;
      border-bottom: 1px solid #222; white-space: nowrap;
      cursor: pointer; user-select: none;
    }
    th:hover { color: #fff; }
    td {
      padding: 10px; border-bottom: 1px solid #181818;
      white-space: nowrap;
    }
    tr:hover td { background: #111; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 1px;
      background: #1a1a1a; color: #888;
    }
    .badge.desktop { border-left: 2px solid #1DB954; color: #1DB954; }
    .badge.mobile { border-left: 2px solid #22c55e; color: #22c55e; }
    .badge.tablet { border-left: 2px solid #3b82f6; color: #3b82f6; }
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 12px; margin-top: 24px;
    }
    .pagination button {
      background: #111; border: 1px solid #333; color: #c0c0c0;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      font-family: inherit; font-size: 0.85rem;
    }
    .pagination button:disabled { opacity: 0.3; cursor: default; }
    .pagination button:hover:not(:disabled) { border-color: #1DB954; }
    .pagination span { color: #555; font-size: 0.85rem; }
    .country { font-size: 0.8rem; }
    .time { color: #555; font-size: 0.78rem; }
    .ip { color: #888; font-family: monospace; font-size: 0.82rem; }
    .ref { color: #555; font-size: 0.78rem; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
    .charts {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px; margin-bottom: 32px;
    }
    .chart-box {
      background: #111; border-radius: 12px; padding: 20px;
      border: 1px solid #222;
    }
    .chart-box h3 {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;
      color: #1DB954; margin-bottom: 16px; font-weight: 700;
    }
    .bar-item {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .bar-item .bar-label {
      width: 100px; font-size: 0.8rem; color: #888; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bar-item .bar-track {
      flex: 1; height: 20px; background: #1a1a1a; border-radius: 4px;
      overflow: hidden;
    }
    .bar-item .bar-fill {
      height: 100%; background: #1DB954; border-radius: 4px;
      transition: width 0.4s;
    }
    .bar-item .bar-count {
      width: 40px; font-size: 0.78rem; color: #555; font-weight: 600;
    }
    @media (max-width: 700px) {
      .container { padding: 16px; }
      header h1 { font-size: 1.2rem; }
      table { font-size: 0.75rem; }
      th, td { padding: 8px 6px; }
      .charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SPOTIFY PROFİL <span>Ziyaretçi Takip</span></h1>
      <div style="color:#555;font-size:0.8rem;" id="live-indicator">● Canlı</div>
    </header>

    <div class="stats-grid" id="stats-grid"></div>
    <div class="charts" id="charts"></div>

    <div class="controls">
      <input type="text" id="search" placeholder="IP, ülke, şehir, tarayıcı... ara">
      <select id="device-filter">
        <option value="">Tüm Cihazlar</option>
        <option value="desktop">Desktop</option>
        <option value="mobile">Mobil</option>
        <option value="tablet">Tablet</option>
      </select>
      <span class="count" id="result-count"></span>
      <button onclick="resetVisitors()" style="background:#8b0000;border:1px solid #cc0000;color:#fff;padding:10px 18px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:0.85rem;font-weight:600;letter-spacing:1px;margin-left:auto;" onmouseover="this.style.background='#cc0000'" onmouseout="this.style.background='#8b0000'">SIFIRLA</button>
    </div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Tarih</th>
            <th>IP</th>
            <th>Ülke</th>
            <th>Şehir</th>
            <th>Cihaz</th>
            <th>Model</th>
            <th>Tarayıcı</th>
            <th>İşletim Sistemi</th>
            <th>ISS</th>
            <th>Yönlendiren</th>
          </tr>
        </thead>
        <tbody id="visitors-tbody"></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    let currentPage = 1;
    let currentSearch = '';
    let currentDevice = '';

    async function fetchStats() {
      const res = await fetch('/api/stats-spotify');
      const stats = await res.json();
      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="value">${stats.total}</div><div class="label">Toplam Tıklama</div></div>
        <div class="stat-card"><div class="value">${stats.uniqueIPs}</div><div class="label">Tekil Ziyaretçi</div></div>
        <div class="stat-card"><div class="value">${stats.countryStats['Turkey'] || stats.countryStats['Türkiye'] || '-'}</div><div class="label">Türkiye'den</div></div>
      `;

      const topCountries = Object.entries(stats.countryStats).sort((a,b) => b[1]-a[1]).slice(0, 6);
      const topBrowsers = Object.entries(stats.browserStats).sort((a,b) => b[1]-a[1]).slice(0, 6);
      const topDevices = Object.entries(stats.deviceStats).sort((a,b) => b[1]-a[1]);

      const maxCountry = topCountries.length ? topCountries[0][1] : 1;
      const maxBrowser = topBrowsers.length ? topBrowsers[0][1] : 1;
      const maxDevice = topDevices.length ? topDevices[0][1] : 1;

      document.getElementById('charts').innerHTML = `
        <div class="chart-box">
          <h3>Ülkelere Göre</h3>
          ${topCountries.map(([k,v]) => `
            <div class="bar-item">
              <span class="bar-label">${k}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${(v/maxCountry)*100}%"></div></div>
              <span class="bar-count">${v}</span>
            </div>
          `).join('')}
        </div>
        <div class="chart-box">
          <h3>Tarayıcılara Göre</h3>
          ${topBrowsers.map(([k,v]) => `
            <div class="bar-item">
              <span class="bar-label">${k}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${(v/maxBrowser)*100}%"></div></div>
              <span class="bar-count">${v}</span>
            </div>
          `).join('')}
        </div>
        <div class="chart-box">
          <h3>Cihazlara Göre</h3>
          ${topDevices.map(([k,v]) => `
            <div class="bar-item">
              <span class="bar-label">${k}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${(v/maxDevice)*100}%"></div></div>
              <span class="bar-count">${v}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function fetchVisitors() {
      const params = new URLSearchParams({ page: currentPage, limit: 50 });
      if (currentSearch) params.set('search', currentSearch);
      if (currentDevice) params.set('device', currentDevice);

      const res = await fetch(`/api/visitors-spotify?${params}`);
      const result = await res.json();

      document.getElementById('result-count').textContent = `${result.total} kayıt (sayfa ${result.page}/${result.totalPages})`;

      const tbody = document.getElementById('visitors-tbody');
      tbody.innerHTML = result.data.map(v => {
        const date = new Date(v.time);
        const timeStr = date.toLocaleDateString('tr-TR') + ' ' + date.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
        const deviceClass = v.device === 'mobile' ? 'mobile' : v.device === 'tablet' ? 'tablet' : 'desktop';
        return `<tr>
          <td class="time">${timeStr}</td>
          <td class="ip">${v.ip}</td>
          <td class="country">${v.country || '?'}</td>
          <td>${v.city || '?'}</td>
          <td><span class="badge ${deviceClass}">${v.device}</span></td>
          <td style="color:#888;font-size:0.82rem;">${v.deviceModel || '-'}</td>
          <td>${v.browser}</td>
          <td>${v.os}</td>
          <td style="font-size:0.78rem;color:#555;">${v.isp || '?'}</td>
          <td class="ref" title="${v.referrer}">${v.referrer}</td>
        </tr>`;
      }).join('');

      const pagination = document.getElementById('pagination');
      pagination.innerHTML = `
        <button ${currentPage <= 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">← Önceki</button>
        <span>Sayfa ${result.page} / ${result.totalPages}</span>
        <button ${currentPage >= result.totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">Sonraki →</button>
      `;
    }

    function goPage(p) {
      currentPage = p;
      fetchVisitors();
    }

    document.getElementById('search').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      currentPage = 1;
      fetchVisitors();
    });

    document.getElementById('device-filter').addEventListener('change', (e) => {
      currentDevice = e.target.value;
      currentPage = 1;
      fetchVisitors();
    });

    async function resetVisitors() {
      if (!confirm('Tüm Spotify kayıtlarını silmek istediğine emin misin?')) return;
      try {
        const res = await fetch('/api/visitors-spotify', { method: 'DELETE' });
        const data = await res.json();
        alert(data.message);
        fetchStats();
        fetchVisitors();
      } catch {
        alert('Hata oluştu.');
      }
    }

    fetchStats();
    fetchVisitors();
    setInterval(() => { fetchStats(); fetchVisitors(); }, 10000);
  </script>
</body>
</html>
